<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Algorithms, Explained Visually</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>Algorithms, Explained Visually</h1>

<div id="controls">
  <select id="problemSelect">
    <option value="cards">Cards / Coins</option>
    <option value="birthday">Birthday</option>
    <option value="airline">Seat Assignment</option>
    <option value="handshake">Handshakes</option>
    <option value="tenPirates">Ten Pirates</option>
  </select>

  <button id="run">Run</button>
  <button id="pause">Pause</button>
  <button id="resume">Resume</button>

  <label>
    <input type="checkbox" id="narrationToggle" />
    Step-by-Step Narration
  </label>

  <button id="nextStep">Next Step</button>
</div>

<div id="status"></div>

<canvas id="canvas" width="2000" height="520"></canvas>

<div id="infoPanel">
  <h3>Problem</h3>
  <p id="problemDesc"></p>

  <h3>Algorithm</h3>
  <p id="algorithmDesc"></p>

  <h3>Narration</h3>
  <p id="liveExplain"></p>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
